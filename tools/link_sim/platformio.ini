; Fake PSU for testing the PSU Link (src/psu_link.cpp) with a bare ESP32-S3.
; pio run -d tools/link_sim -t upload --upload-port /dev/ttyACMx
[env:sim]
platform = espressif32@6.6.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1
