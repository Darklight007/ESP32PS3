; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32@6.6.0
board = esp32-s3-devkitc-1-n16r8
framework = arduino
upload_speed = 921600
monitor_speed = 115200
; Target the S3's native USB, which always enumerates as CDC-ACM (/dev/ttyACM*).
; A PL2303 adapter on this machine claims /dev/ttyUSB0, and uploading there
; fails with "No serial data received" - there is no ESP32 behind it - so the
; glob deliberately excludes ttyUSB*. A glob rather than a fixed name because
; the number moves (ttyACM0/ttyACM1) when the board re-enumerates after a reset;
; an earlier by-id path pinned one board's MAC and broke on every board swap.
; If you flash through an external UART bridge (CH340/CP210x -> ttyUSB*),
; override per-invocation: pio run -t upload --upload-port /dev/ttyUSB0
upload_port = /dev/ttyACM*
monitor_port = /dev/ttyACM*
monitor_filters = esp32_exception_decoder, default
extra_scripts = pre:update_version.py
board_build.partitions = par/default_16MB_2.csv
build_flags =
	-w
	-O3
	; -D RELEASE  ; Temporarily disabled for ADC debugging
	-std=gnu++2a
	-I include
	-D CORE_DEBUG_LEVEL=4  ; Enable INFO level logging
build_unflags = 
	-std=gnu++11
	-std=gnu++14
	-std=gnu++17

build_src_filter =
   +<*>                # Include all files by default
   -<experimental/>  # Exclude this folder (relative to src/)

; lib_deps = adafruit/Adafruit NeoPixel@^1.12.5
 
